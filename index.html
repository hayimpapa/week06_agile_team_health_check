<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squad Health Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .rag-green { background-color: #22c55e; }
    .rag-amber { background-color: #f59e0b; }
    .rag-red { background-color: #ef4444; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ─── Default Spotify Card Deck ───
    const DEFAULT_CARDS = [
      { id: 'easy-release', title: 'Easy to Release', awesome: 'Releasing is simple, safe, and mostly automated', crappy: 'Releasing is risky, painful, and takes forever' },
      { id: 'process', title: 'Suitable Process', awesome: 'Our way of working fits us perfectly', crappy: 'Our way of working sucks' },
      { id: 'tech-quality', title: 'Tech Quality', awesome: "We're proud of our code — clean, readable, well tested", crappy: 'Our code is a mess and technical debt is out of control' },
      { id: 'value', title: 'Value', awesome: 'We deliver great stuff our stakeholders love', crappy: 'We deliver crap. Our stakeholders hate us' },
      { id: 'speed', title: 'Speed', awesome: 'We get stuff done quickly — no waiting, no blockers', crappy: 'We never finish anything. Always stuck or interrupted' },
      { id: 'mission', title: 'Mission', awesome: "We know exactly why we're here and we're excited", crappy: 'We have no idea why we exist. No focus, no direction' },
      { id: 'fun', title: 'Fun', awesome: 'We love working together', crappy: 'Booooooring' },
      { id: 'learning', title: 'Learning', awesome: "We're learning interesting things all the time", crappy: 'We never have time to learn anything' },
      { id: 'support', title: 'Support', awesome: 'We always get great help when we ask', crappy: 'We keep getting stuck because support never comes' },
      { id: 'autonomy', title: 'Autonomy', awesome: 'We control our destiny — we decide what and how to build', crappy: "We're just pawns. No influence over what we build" },
    ];

    // ─── Utility helpers ───
    const generateId = () => Math.random().toString(36).substring(2, 8);

    const getSessionIdFromHash = () => {
      const hash = window.location.hash;
      const match = hash.match(/session=([a-zA-Z0-9]+)/);
      return match ? match[1] : null;
    };

    const loadSession = (sessionId) => {
      try {
        const raw = localStorage.getItem(`shc_session_${sessionId}`);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    };

    const saveSession = (session) => {
      localStorage.setItem(`shc_session_${session.id}`, JSON.stringify(session));
    };

    const loadResponses = (sessionId) => {
      try {
        const raw = localStorage.getItem(`shc_responses_${sessionId}`);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    };

    const saveResponses = (sessionId, responses) => {
      localStorage.setItem(`shc_responses_${sessionId}`, JSON.stringify(responses));
    };

    const hasSubmitted = (sessionId) => {
      return localStorage.getItem(`shc_submitted_${sessionId}`) === 'true';
    };

    const markSubmitted = (sessionId) => {
      localStorage.setItem(`shc_submitted_${sessionId}`, 'true');
    };

    const isAdmin = (sessionId) => {
      return localStorage.getItem(`shc_admin_${sessionId}`) === 'true';
    };

    const markAdmin = (sessionId) => {
      localStorage.setItem(`shc_admin_${sessionId}`, 'true');
    };

    const findPreviousSession = (sessionName, currentSessionId) => {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('shc_session_'));
      let best = null;
      for (const key of keys) {
        try {
          const s = JSON.parse(localStorage.getItem(key));
          if (s && s.name === sessionName && s.id !== currentSessionId) {
            if (!best || (s.createdAt && s.createdAt > best.createdAt)) {
              best = s;
            }
          }
        } catch {}
      }
      return best;
    };

    // ─── RAG colors ───
    const RAG = {
      green: { label: 'Awesome', emoji: '\u{1F7E2}', bg: 'bg-green-500', bgLight: 'bg-green-100', text: 'text-green-700', border: 'border-green-500' },
      amber: { label: 'OK', emoji: '\u{1F7E1}', bg: 'bg-amber-500', bgLight: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-500' },
      red:   { label: 'Struggling', emoji: '\u{1F534}', bg: 'bg-red-500', bgLight: 'bg-red-100', text: 'text-red-700', border: 'border-red-500' },
    };

    // ─── Components ───

    function Header({ title, subtitle }) {
      return (
        <header className="bg-white shadow-sm border-b border-gray-200">
          <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                <span className="text-2xl">&#9876;</span> Squad Health Check
              </h1>
              {subtitle && <p className="text-sm text-gray-500 mt-0.5">{subtitle}</p>}
            </div>
            {title && <span className="text-sm font-medium text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">{title}</span>}
          </div>
        </header>
      );
    }

    // ─── Admin: Create Session ───
    function CreateSession({ onCreate }) {
      const [name, setName] = useState('');
      const [cards, setCards] = useState(DEFAULT_CARDS.map(c => ({ ...c })));
      const [votingMode, setVotingMode] = useState('one-at-a-time');
      const [editing, setEditing] = useState(false);

      const addCard = () => {
        setCards([...cards, { id: generateId(), title: '', awesome: '', crappy: '' }]);
      };

      const removeCard = (idx) => {
        setCards(cards.filter((_, i) => i !== idx));
      };

      const updateCard = (idx, field, value) => {
        const updated = [...cards];
        updated[idx] = { ...updated[idx], [field]: value };
        setCards(updated);
      };

      const handleCreate = () => {
        if (!name.trim()) return;
        const validCards = cards.filter(c => c.title.trim());
        if (validCards.length === 0) return;
        const sessionId = generateId();
        const session = {
          id: sessionId,
          name: name.trim(),
          cards: validCards,
          votingMode,
          createdAt: new Date().toISOString(),
        };
        saveSession(session);
        markAdmin(sessionId);
        window.location.hash = `session=${sessionId}`;
        onCreate(session);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 fade-in">
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-lg font-semibold text-gray-900 mb-4">Create New Health Check Session</h2>

            <label className="block text-sm font-medium text-gray-700 mb-1">Session Name</label>
            <input
              type="text"
              value={name}
              onChange={e => setName(e.target.value)}
              placeholder='e.g. "Platform Squad — Q2 2025"'
              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4"
            />

            <label className="block text-sm font-medium text-gray-700 mb-1">Voting Mode</label>
            <div className="flex gap-3 mb-6">
              <button
                onClick={() => setVotingMode('one-at-a-time')}
                className={`px-4 py-2 rounded-lg text-sm font-medium border transition ${votingMode === 'one-at-a-time' ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}
              >
                One card at a time
              </button>
              <button
                onClick={() => setVotingMode('all-at-once')}
                className={`px-4 py-2 rounded-lg text-sm font-medium border transition ${votingMode === 'all-at-once' ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}
              >
                All cards at once
              </button>
            </div>

            <div className="flex items-center justify-between mb-3">
              <label className="text-sm font-medium text-gray-700">Card Deck ({cards.length} cards)</label>
              <div className="flex gap-2">
                <button onClick={() => setEditing(!editing)} className="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
                  {editing ? 'Done Editing' : 'Customise Cards'}
                </button>
              </div>
            </div>

            {!editing ? (
              <div className="grid gap-2 mb-6">
                {cards.map((card, i) => (
                  <div key={card.id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2 text-sm">
                    <span className="font-medium text-gray-800 w-40 truncate">{card.title || '(untitled)'}</span>
                    <span className="text-green-600 truncate flex-1" title={card.awesome}>{card.awesome}</span>
                    <span className="text-gray-400 mx-1">|</span>
                    <span className="text-red-500 truncate flex-1" title={card.crappy}>{card.crappy}</span>
                  </div>
                ))}
              </div>
            ) : (
              <div className="space-y-3 mb-6">
                {cards.map((card, i) => (
                  <div key={card.id} className="border border-gray-200 rounded-lg p-3 bg-gray-50 relative">
                    <button onClick={() => removeCard(i)} className="absolute top-2 right-2 text-red-400 hover:text-red-600 text-xs font-bold" title="Remove card">&times;</button>
                    <input
                      value={card.title}
                      onChange={e => updateCard(i, 'title', e.target.value)}
                      placeholder="Card title"
                      className="w-full border border-gray-300 rounded px-2 py-1 text-sm mb-1 focus:outline-none focus:ring-1 focus:ring-indigo-400"
                    />
                    <input
                      value={card.awesome}
                      onChange={e => updateCard(i, 'awesome', e.target.value)}
                      placeholder="Example of Awesome"
                      className="w-full border border-gray-300 rounded px-2 py-1 text-sm mb-1 text-green-700 focus:outline-none focus:ring-1 focus:ring-green-400"
                    />
                    <input
                      value={card.crappy}
                      onChange={e => updateCard(i, 'crappy', e.target.value)}
                      placeholder="Example of Crappy"
                      className="w-full border border-gray-300 rounded px-2 py-1 text-sm text-red-600 focus:outline-none focus:ring-1 focus:ring-red-400"
                    />
                  </div>
                ))}
                <button onClick={addCard} className="w-full border-2 border-dashed border-gray-300 rounded-lg py-2 text-sm text-gray-500 hover:border-indigo-400 hover:text-indigo-600 transition">
                  + Add Card
                </button>
              </div>
            )}

            <button
              onClick={handleCreate}
              disabled={!name.trim() || cards.filter(c => c.title.trim()).length === 0}
              className="w-full bg-indigo-600 text-white font-medium rounded-lg py-2.5 text-sm hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
            >
              Create Session
            </button>
          </div>
        </div>
      );
    }

    // ─── Voting Interface ───
    function VotingCard({ card, vote, comment, onVote, onComment }) {
      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 fade-in">
          <h3 className="text-lg font-bold text-gray-900 mb-4">{card.title}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
            <div className="bg-green-50 border border-green-200 rounded-lg p-3">
              <div className="text-xs font-semibold text-green-700 uppercase tracking-wide mb-1">{RAG.green.emoji} Example of Awesome</div>
              <p className="text-sm text-green-800">{card.awesome}</p>
            </div>
            <div className="bg-red-50 border border-red-200 rounded-lg p-3">
              <div className="text-xs font-semibold text-red-700 uppercase tracking-wide mb-1">{RAG.red.emoji} Example of Crappy</div>
              <p className="text-sm text-red-800">{card.crappy}</p>
            </div>
          </div>
          <div className="flex gap-2 mb-4">
            {Object.entries(RAG).map(([key, r]) => (
              <button
                key={key}
                onClick={() => onVote(key)}
                className={`flex-1 py-2.5 rounded-lg text-sm font-medium border-2 transition ${
                  vote === key
                    ? `${r.bgLight} ${r.border} ${r.text}`
                    : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'
                }`}
              >
                {r.emoji} {r.label}
              </button>
            ))}
          </div>
          <input
            type="text"
            value={comment}
            onChange={e => onComment(e.target.value)}
            placeholder="Optional comment..."
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            maxLength={200}
          />
        </div>
      );
    }

    function VotingInterface({ session }) {
      const [votes, setVotes] = useState({});
      const [comments, setComments] = useState({});
      const [currentIdx, setCurrentIdx] = useState(0);
      const [submitted, setSubmitted] = useState(hasSubmitted(session.id));

      const setVote = (cardId, value) => {
        setVotes(v => ({ ...v, [cardId]: value }));
      };

      const setComment = (cardId, value) => {
        setComments(c => ({ ...c, [cardId]: value }));
      };

      const allVoted = session.cards.every(c => votes[c.id]);

      const handleSubmit = () => {
        if (!allVoted) return;
        const response = {
          id: generateId(),
          timestamp: new Date().toISOString(),
          votes: { ...votes },
          comments: { ...comments },
        };
        const existing = loadResponses(session.id);
        existing.push(response);
        saveResponses(session.id, existing);
        markSubmitted(session.id);
        setSubmitted(true);
      };

      if (submitted) {
        return (
          <div className="max-w-xl mx-auto px-4 py-16 text-center fade-in">
            <div className="text-5xl mb-4">&#10004;&#65039;</div>
            <h2 className="text-xl font-bold text-gray-900 mb-2">Thanks for your input!</h2>
            <p className="text-gray-500 text-sm">Your votes have been recorded. You can close this page now.</p>
          </div>
        );
      }

      const isOneAtATime = session.votingMode === 'one-at-a-time';
      const currentCard = session.cards[currentIdx];
      const progress = Object.keys(votes).length;

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 fade-in">
          <div className="mb-4 flex items-center justify-between">
            <h2 className="text-sm font-medium text-gray-500">
              {session.name} &middot; {progress}/{session.cards.length} voted
            </h2>
            <div className="w-32 bg-gray-200 rounded-full h-2">
              <div className="bg-indigo-500 h-2 rounded-full transition-all" style={{ width: `${(progress / session.cards.length) * 100}%` }}></div>
            </div>
          </div>

          {isOneAtATime ? (
            <div>
              <VotingCard
                key={currentCard.id}
                card={currentCard}
                vote={votes[currentCard.id] || null}
                comment={comments[currentCard.id] || ''}
                onVote={v => setVote(currentCard.id, v)}
                onComment={v => setComment(currentCard.id, v)}
              />
              <div className="flex justify-between mt-4">
                <button
                  onClick={() => setCurrentIdx(i => Math.max(0, i - 1))}
                  disabled={currentIdx === 0}
                  className="px-4 py-2 rounded-lg text-sm font-medium bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed transition"
                >
                  &larr; Previous
                </button>
                {currentIdx < session.cards.length - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(i => Math.min(session.cards.length - 1, i + 1))}
                    className="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition"
                  >
                    Next &rarr;
                  </button>
                ) : (
                  <button
                    onClick={handleSubmit}
                    disabled={!allVoted}
                    className="px-6 py-2 rounded-lg text-sm font-medium bg-green-600 text-white hover:bg-green-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
                  >
                    Submit Votes
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div>
              <div className="space-y-4">
                {session.cards.map(card => (
                  <VotingCard
                    key={card.id}
                    card={card}
                    vote={votes[card.id] || null}
                    comment={comments[card.id] || ''}
                    onVote={v => setVote(card.id, v)}
                    onComment={v => setComment(card.id, v)}
                  />
                ))}
              </div>
              <button
                onClick={handleSubmit}
                disabled={!allVoted}
                className="w-full mt-6 px-6 py-3 rounded-lg text-sm font-medium bg-green-600 text-white hover:bg-green-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                Submit All Votes
              </button>
            </div>
          )}
        </div>
      );
    }

    // ─── Results Dashboard ───
    function ResultsDashboard({ session }) {
      const [responses, setResponses] = useState(loadResponses(session.id));
      const [showComments, setShowComments] = useState(false);
      const [copied, setCopied] = useState(false);

      const refresh = () => setResponses(loadResponses(session.id));

      // Find previous session for trend comparison
      const prevSession = useMemo(() => findPreviousSession(session.name, session.id), [session.name, session.id]);
      const prevResponses = useMemo(() => prevSession ? loadResponses(prevSession.id) : [], [prevSession]);

      const getStats = useCallback((cardId, resps) => {
        const counts = { green: 0, amber: 0, red: 0 };
        resps.forEach(r => {
          const v = r.votes[cardId];
          if (v && counts.hasOwnProperty(v)) counts[v]++;
        });
        const total = counts.green + counts.amber + counts.red;
        return { counts, total };
      }, []);

      const getMajority = (cardId, resps) => {
        const { counts, total } = getStats(cardId, resps);
        if (total === 0) return null;
        if (counts.green >= counts.amber && counts.green >= counts.red) return 'green';
        if (counts.amber >= counts.green && counts.amber >= counts.red) return 'amber';
        return 'red';
      };

      const getAvgScore = (cardId, resps) => {
        const { counts, total } = getStats(cardId, resps);
        if (total === 0) return 0;
        return (counts.green * 3 + counts.amber * 2 + counts.red * 1) / total;
      };

      const getTrend = (cardId) => {
        if (!prevSession || prevResponses.length === 0) return null;
        const curr = getAvgScore(cardId, responses);
        const prev = getAvgScore(cardId, prevResponses);
        if (curr > prev + 0.1) return '\u2191';
        if (curr < prev - 0.1) return '\u2193';
        return '\u2192';
      };

      const trendColor = (arrow) => {
        if (arrow === '\u2191') return 'text-green-600';
        if (arrow === '\u2193') return 'text-red-600';
        return 'text-gray-400';
      };

      const shareUrl = `${window.location.origin}${window.location.pathname}#session=${session.id}`;

      const exportText = () => {
        let text = `Squad Health Check: ${session.name}\n`;
        text += `Created: ${new Date(session.createdAt).toLocaleDateString()}\n`;
        text += `Respondents: ${responses.length}\n`;
        text += `${'─'.repeat(50)}\n\n`;
        session.cards.forEach(card => {
          const { counts, total } = getStats(card.id, responses);
          const trend = getTrend(card.id);
          text += `${card.title}${trend ? ' ' + trend : ''}\n`;
          if (total > 0) {
            text += `  GREEN: ${counts.green} (${Math.round(counts.green / total * 100)}%)  `;
            text += `AMBER: ${counts.amber} (${Math.round(counts.amber / total * 100)}%)  `;
            text += `RED: ${counts.red} (${Math.round(counts.red / total * 100)}%)\n`;
          } else {
            text += '  No votes yet\n';
          }
          text += '\n';
        });
        return text;
      };

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(exportText());
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          // Fallback
          const ta = document.createElement('textarea');
          ta.value = exportText();
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 fade-in">
          {/* Top bar */}
          <div className="flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center mb-6">
            <div>
              <h2 className="text-lg font-bold text-gray-900">Results Dashboard</h2>
              <p className="text-sm text-gray-500">
                {responses.length} respondent{responses.length !== 1 ? 's' : ''} &middot; Created {new Date(session.createdAt).toLocaleDateString()}
              </p>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={refresh} className="px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                &#x21bb; Refresh
              </button>
              <button onClick={handleCopy} className="px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                {copied ? '&#10003; Copied!' : '&#128203; Copy Results'}
              </button>
              <button onClick={() => setShowComments(!showComments)} className="px-3 py-1.5 rounded-lg text-xs font-medium bg-white border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                {showComments ? 'Hide Comments' : 'Show Comments'}
              </button>
            </div>
          </div>

          {/* Share link */}
          <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-3 mb-6 flex flex-col sm:flex-row items-start sm:items-center gap-2">
            <span className="text-sm font-medium text-indigo-700">Share with your team:</span>
            <code className="text-xs bg-white border border-indigo-200 rounded px-2 py-1 text-indigo-600 break-all flex-1">{shareUrl}</code>
            <button
              onClick={() => { navigator.clipboard.writeText(shareUrl); }}
              className="text-xs font-medium text-indigo-600 hover:text-indigo-800 whitespace-nowrap"
            >
              Copy Link
            </button>
          </div>

          {responses.length === 0 ? (
            <div className="text-center py-16 text-gray-400">
              <div className="text-4xl mb-3">&#128202;</div>
              <p className="text-sm">No responses yet. Share the link above with your team to start collecting votes.</p>
            </div>
          ) : (
            <>
              {/* Per-card RAG bars */}
              <div className="space-y-3 mb-8">
                {session.cards.map(card => {
                  const { counts, total } = getStats(card.id, responses);
                  const trend = getTrend(card.id);
                  return (
                    <div key={card.id} className="bg-white rounded-lg border border-gray-200 p-4">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-sm font-semibold text-gray-800">{card.title}</span>
                        <div className="flex items-center gap-2">
                          {trend && <span className={`text-lg font-bold ${trendColor(trend)}`}>{trend}</span>}
                          <span className="text-xs text-gray-400">{total} vote{total !== 1 ? 's' : ''}</span>
                        </div>
                      </div>
                      {total > 0 ? (
                        <>
                          <div className="flex rounded-full overflow-hidden h-6 mb-2">
                            {counts.green > 0 && (
                              <div className="bg-green-500 flex items-center justify-center text-white text-xs font-medium" style={{ width: `${(counts.green / total) * 100}%` }}>
                                {counts.green}
                              </div>
                            )}
                            {counts.amber > 0 && (
                              <div className="bg-amber-500 flex items-center justify-center text-white text-xs font-medium" style={{ width: `${(counts.amber / total) * 100}%` }}>
                                {counts.amber}
                              </div>
                            )}
                            {counts.red > 0 && (
                              <div className="bg-red-500 flex items-center justify-center text-white text-xs font-medium" style={{ width: `${(counts.red / total) * 100}%` }}>
                                {counts.red}
                              </div>
                            )}
                          </div>
                          <div className="flex gap-4 text-xs text-gray-500">
                            <span>{RAG.green.emoji} {Math.round(counts.green / total * 100)}%</span>
                            <span>{RAG.amber.emoji} {Math.round(counts.amber / total * 100)}%</span>
                            <span>{RAG.red.emoji} {Math.round(counts.red / total * 100)}%</span>
                          </div>
                        </>
                      ) : (
                        <div className="text-xs text-gray-400">No votes for this card yet</div>
                      )}

                      {/* Comments */}
                      {showComments && (
                        <div className="mt-3 border-t border-gray-100 pt-2">
                          {responses.filter(r => r.comments[card.id]).length > 0 ? (
                            <div className="space-y-1">
                              {responses.filter(r => r.comments[card.id]).map((r, i) => (
                                <div key={i} className="text-xs text-gray-500 bg-gray-50 rounded px-2 py-1">
                                  &ldquo;{r.comments[card.id]}&rdquo;
                                </div>
                              ))}
                            </div>
                          ) : (
                            <p className="text-xs text-gray-300 italic">No comments</p>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Heatmap Grid */}
              <div className="bg-white rounded-lg border border-gray-200 p-4 mb-8">
                <h3 className="text-sm font-semibold text-gray-800 mb-3">Heatmap Overview</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr>
                        <th className="text-left text-xs font-medium text-gray-500 pb-2 pr-4">Card</th>
                        <th className="text-center text-xs font-medium text-gray-500 pb-2 px-2">Status</th>
                        {prevSession && <th className="text-center text-xs font-medium text-gray-500 pb-2 px-2">Trend</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {session.cards.map(card => {
                        const majority = getMajority(card.id, responses);
                        const trend = getTrend(card.id);
                        const colorMap = {
                          green: 'bg-green-500',
                          amber: 'bg-amber-500',
                          red: 'bg-red-500',
                        };
                        return (
                          <tr key={card.id} className="border-t border-gray-100">
                            <td className="py-2 pr-4 font-medium text-gray-700">{card.title}</td>
                            <td className="py-2 px-2 text-center">
                              {majority ? (
                                <span className={`inline-block w-8 h-8 rounded ${colorMap[majority]}`}></span>
                              ) : (
                                <span className="inline-block w-8 h-8 rounded bg-gray-200"></span>
                              )}
                            </td>
                            {prevSession && (
                              <td className={`py-2 px-2 text-center text-lg font-bold ${trend ? trendColor(trend) : 'text-gray-300'}`}>
                                {trend || '—'}
                              </td>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ─── Admin View (Dashboard + share) ───
    function AdminView({ session }) {
      const [tab, setTab] = useState('dashboard');

      return (
        <div>
          <div className="max-w-5xl mx-auto px-4 pt-4">
            <div className="flex gap-1 bg-gray-100 rounded-lg p-1 w-fit">
              <button
                onClick={() => setTab('dashboard')}
                className={`px-4 py-1.5 rounded-md text-sm font-medium transition ${tab === 'dashboard' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'}`}
              >
                Results Dashboard
              </button>
              <button
                onClick={() => setTab('vote')}
                className={`px-4 py-1.5 rounded-md text-sm font-medium transition ${tab === 'vote' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'}`}
              >
                Vote (Preview)
              </button>
            </div>
          </div>
          {tab === 'dashboard' ? (
            <ResultsDashboard session={session} />
          ) : (
            <VotingInterface session={session} />
          )}
        </div>
      );
    }

    // ─── App Root ───
    function App() {
      const [sessionId, setSessionId] = useState(getSessionIdFromHash());
      const [session, setSession] = useState(null);
      const [admin, setAdmin] = useState(false);

      useEffect(() => {
        const onHashChange = () => {
          const id = getSessionIdFromHash();
          setSessionId(id);
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      useEffect(() => {
        if (sessionId) {
          const s = loadSession(sessionId);
          setSession(s);
          setAdmin(isAdmin(sessionId));
        } else {
          setSession(null);
          setAdmin(false);
        }
      }, [sessionId]);

      const handleCreate = (newSession) => {
        setSession(newSession);
        setSessionId(newSession.id);
        setAdmin(true);
      };

      const goHome = () => {
        window.location.hash = '';
        setSessionId(null);
        setSession(null);
        setAdmin(false);
      };

      // No session ID in URL → show create form
      if (!sessionId) {
        return (
          <div>
            <Header />
            <CreateSession onCreate={handleCreate} />
          </div>
        );
      }

      // Session ID in URL but session not found
      if (!session) {
        return (
          <div>
            <Header />
            <div className="max-w-xl mx-auto px-4 py-16 text-center">
              <div className="text-4xl mb-4">&#128533;</div>
              <h2 className="text-lg font-bold text-gray-900 mb-2">Session not found</h2>
              <p className="text-sm text-gray-500 mb-4">This session doesn't exist in your browser's storage.</p>
              <button onClick={goHome} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
                Create New Session
              </button>
            </div>
          </div>
        );
      }

      // Admin view
      if (admin) {
        return (
          <div>
            <header className="bg-white shadow-sm border-b border-gray-200">
              <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
                <div className="cursor-pointer" onClick={goHome}>
                  <h1 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                    <span className="text-2xl">&#9876;</span> Squad Health Check
                  </h1>
                  <p className="text-sm text-gray-500 mt-0.5">Admin View</p>
                </div>
                <span className="text-sm font-medium text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">{session.name}</span>
              </div>
            </header>
            <AdminView session={session} />
          </div>
        );
      }

      // Team member view
      return (
        <div>
          <Header title={session.name} subtitle="Team Member Voting" />
          <VotingInterface session={session} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
